<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cache Rider</title>
<meta name="description" content="Unofficial schedule app for Connect, the Cache Valley Transit District bus. Next buses at any stop, the Transit Center bay by bay, and a map.">
<meta name="theme-color" content="#f2f2f3">
<style>html{background:#f2f2f3;color-scheme:light}@media(prefers-color-scheme:dark){html:not([data-theme=light]){background:#101214;color-scheme:dark}}html[data-theme=dark]{background:#101214;color-scheme:dark}</style>
<script>(function(){var m=matchMedia("(prefers-color-scheme: dark)"),t=document.querySelector("meta[name=theme-color]"),r=document.documentElement,s=null;try{s=localStorage.getItem("cr-theme")}catch(e){}if(s==="light"||s==="dark")r.dataset.theme=s;function set(){var d=m.matches&&r.dataset.theme!=="light"||r.dataset.theme==="dark";t.content=d?"#101214":"#f2f2f3";}set();m.addEventListener("change",set);document.addEventListener("visibilitychange",set);})()</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cache Rider">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml" sizes="any">
<link rel="icon" href="./icons/icon-96.png" type="image/png" sizes="96x96">
<link rel="icon" href="./favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
<link rel="preload" href="./fonts/barlow-condensed-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./fonts/barlow-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./vendor/maplibre-gl.css">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>
<div id="app">
  <header id="top">
    <a class="wordmark" href="#/">Cache Rider</a>
    <nav id="topnav"></nav>
    <form class="search" id="topsearch" role="search"><input class="input" type="search" placeholder="Street or address, e.g. 500 North" autocomplete="off" aria-label="Search stops"><span class="lead"></span></form>
  </header>
  <div id="body">
    <main id="side" aria-live="polite"><div class="empty"><p>Loading the timetable…</p></div></main>
    <div id="mapcol"><div id="map"></div></div>
  </div>
  <nav id="tabs"></nav>
</div>
<script type="module" src="./app/main.js"></script>
<noscript><p style="padding:16px">Cache Rider needs JavaScript to read the timetable.</p></noscript>
</body>
</html>
