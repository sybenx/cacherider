# The Android app: a Trusted Web Activity built and signed here, attached to a
# GitHub release for Obtainium and the like, and an app bundle for Google Play. Push a tag like v1.0.0 to release;
# run it by hand for an unsigned test build that lands in the run's artifacts.
name: android
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    env: { PLAY_JSON: '${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}' }   # whether there's a key to reach Google Play with
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Version from the tag
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then n="${GITHUB_REF#refs/tags/v}"; else n="0.0.$GITHUB_RUN_NUMBER"; fi
          IFS=. read -r a b c <<< "$n"
          echo "name=$n" >> "$GITHUB_OUTPUT"
          echo "code=$((a * 10000 + b * 100 + c))" >> "$GITHUB_OUTPUT"
      - name: Keystore from the secrets
        if: github.event_name == 'push'
        env: { KS: '${{ secrets.ANDROID_KEYSTORE_B64 }}' }
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease bundleRelease -PversionName=${{ steps.v.outputs.name }} -PversionCode=${{ steps.v.outputs.code }}
          cp app/build/outputs/apk/release/app-release*.apk "cacherider-${{ steps.v.outputs.name }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "cacherider-${{ steps.v.outputs.name }}.aab"
      - name: Check the signature
        if: github.event_name == 'push'
        run: |
          apk=$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$apk/apksigner" verify --print-certs "cacherider-${{ steps.v.outputs.name }}.apk" | grep -i sha-256
      - uses: actions/upload-artifact@v4
        with: { name: 'cacherider-${{ steps.v.outputs.name }}', path: 'android/cacherider-*.a[ap][kb]' }
      # Google Play: the signed bundle up to the testing track (the PLAY_TRACK variable, else closed testing's 'alpha'),
      # rolled out to it (Google's review first, then the testers have it), no tap in the Play Console. Where Play
      # won't take a release that way (an app not yet through its first review takes drafts only), a draft instead,
      # to roll out from the Console. Only once a service account with release rights in the Play Console has its JSON
      # key in the PLAY_SERVICE_ACCOUNT_JSON secret.
      - name: Up to Google Play
        id: play
        if: github.event_name == 'push' && env.PLAY_JSON != ''
        continue-on-error: true   # Play refusing doesn't hold up the GitHub release
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.cacherider.android
          releaseFiles: android/cacherider-${{ steps.v.outputs.name }}.aab
          tracks: ${{ vars.PLAY_TRACK || 'alpha' }}
          status: completed
      - name: Up to Google Play, as a draft
        if: github.event_name == 'push' && env.PLAY_JSON != '' && steps.play.outcome == 'failure'
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.cacherider.android
          releaseFiles: android/cacherider-${{ steps.v.outputs.name }}.aab
          tracks: ${{ vars.PLAY_TRACK || 'alpha' }}
          status: draft
      - name: Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/cacherider-*.apk
            android/cacherider-*.aab
          body: |
            **Looking for bus times? Open [cacherider.com](https://cacherider.com).** It works in any phone's browser; nothing to install.

            <p><picture><source media="(prefers-color-scheme: dark)" srcset="https://raw.githubusercontent.com/sybenx/cacherider/main/docs/screenshots/desktop-dark.jpg"><img src="https://raw.githubusercontent.com/sybenx/cacherider/main/docs/screenshots/desktop-light.jpg" width="76%" alt="Cache Rider on a computer"></picture> <picture><source media="(prefers-color-scheme: dark)" srcset="https://raw.githubusercontent.com/sybenx/cacherider/main/docs/screenshots/phone-dark.png"><img src="https://raw.githubusercontent.com/sybenx/cacherider/main/docs/screenshots/phone-light.png" width="21.5%" alt="Cache Rider on a phone"></picture></p>

            This release is the Android app, for phones without Chrome (GrapheneOS and the like). It opens cacherider.com full screen in your phone's own browser.
            Install the APK, or add this repository to Obtainium to keep it updated. The .aab is the same app packaged for Google Play.

            **Compass on GrapheneOS:** the app runs inside Vanadium, which keeps motion sensors from every site until you allow them. In Vanadium, Settings → Site settings → Motion sensors, allow cacherider.com (or tap the lock in the address bar on the site).
