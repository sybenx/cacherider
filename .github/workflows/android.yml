# The Android app: a Trusted Web Activity built and signed here, attached to a
# GitHub release for Obtainium and the like. Push a tag like v1.0.0 to release;
# run it by hand for an unsigned test build that lands in the run's artifacts.
name: android
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Version from the tag
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then n="${GITHUB_REF#refs/tags/v}"; else n="0.0.$GITHUB_RUN_NUMBER"; fi
          IFS=. read -r a b c <<< "$n"
          echo "name=$n" >> "$GITHUB_OUTPUT"
          echo "code=$((a * 10000 + b * 100 + c))" >> "$GITHUB_OUTPUT"
      - name: Keystore from the secrets
        if: github.event_name == 'push'
        env: { KS: '${{ secrets.ANDROID_KEYSTORE_B64 }}' }
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease -PversionName=${{ steps.v.outputs.name }} -PversionCode=${{ steps.v.outputs.code }}
          cp app/build/outputs/apk/release/app-release*.apk "cacherider-${{ steps.v.outputs.name }}.apk"
      - name: Check the signature
        if: github.event_name == 'push'
        run: |
          apk=$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$apk/apksigner" verify --print-certs "cacherider-${{ steps.v.outputs.name }}.apk" | grep -i sha-256
      - uses: actions/upload-artifact@v4
        with: { name: 'cacherider-${{ steps.v.outputs.name }}', path: 'android/cacherider-*.apk' }
      - name: Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: android/cacherider-*.apk
          body: |
            **Looking for bus times? Open [cacherider.com](https://cacherider.com).** It works in any phone's browser; nothing to install.

            This release is the Android app, for phones without Chrome (GrapheneOS and the like). It opens cacherider.com full screen in your phone's own browser.
            Install the APK, or add this repository to Obtainium to keep it updated.
