name: service alerts

# Every quarter hour (as GitHub gets to it: a schedule runs late, hours late at
# times), fetch the agency's notices and commit them if they changed. The app
# reads them live from the relay (live.cacherider.com/alerts); this file is what
# it falls back on. The phone can't read the feeds itself: the server refuses
# requests that carry a browser Origin header.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# One of the data jobs (this, the timetable, the map) at a time, so their pushes never race.
concurrency:
  group: data-push
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and decode
        # Unreachable (75, tools/upstream.py): the last file kept, green. Broken: the last file kept, and the run red.
        run: python3 tools/upstream.py tools/alerts.py || { s=$?; git checkout -- data/alerts.json; [ $s = 75 ] && echo 'alerts feed unreachable; keeping the last file'; }
      - name: Commit if changed
        run: |
          # The fetched time alone is not a change worth a commit.
          changed=$(python3 - <<'EOF'
          import json, subprocess
          new = json.load(open('data/alerts.json')); new.pop('fetched', None)
          try:
              old = json.loads(subprocess.check_output(['git', 'show', 'HEAD:data/alerts.json'])); old.pop('fetched', None)
          except Exception:
              old = None
          print('yes' if new != old else 'no')
          EOF
          )
          if [ "$changed" != yes ]; then echo 'no change'; git checkout -- data; exit 0; fi
          git config user.name 'service alerts'
          git config user.email 'actions@users.noreply.github.com'
          git add data/alerts.json
          git commit -m "Service alerts: $(date -u +'%Y-%m-%d %H:%M')"
          # Onto whatever another run (alerts, the timetable, the map) pushed meanwhile, a few tries.
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done; exit 1
