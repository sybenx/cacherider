name: transit data

# Every night, fetch the agency's GTFS, reduce it to what the app reads, and
# commit the result if it changed. Hosting redeploys from the commit.

on:
  schedule:
    - cron: '23 9 * * *'   # 03:23 Mountain, after the agency's overnight update
  workflow_dispatch:

permissions:
  contents: write

# One of the data jobs (this, the alerts, the map) at a time: two committing at once had the second's rebase stuck on
# the one-line crossings.json both had written, and its push failed.
concurrency:
  group: data-push
  cancel-in-progress: false

jobs:
  reduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch CVTD GTFS
        run: curl -fsSL -o /tmp/cvtd.zip https://mycvtdbus.org/gtfs
      - name: Reduce
        run: |
          pip install -q mapbox-vector-tile==2.2.0
          python3 tools/reduce.py /tmp/cvtd.zip --hints tools/hints.json --out data
      # A route still in the feed but with no trips (the Blue Loop on 22 Oct 2026, CVTD's feed unchanged in name) is the
      # feed broken, not the route gone: yesterday's timetable stands and the run ends red.
      - name: No route emptied
        run: |
          python3 - <<'EOF' || { git checkout -- data/cvtd.json data/cvtd-shapes.json; echo "BROKE=${BROKE:+$BROKE }data/cvtd.json" >> "$GITHUB_ENV"; }
          import json, subprocess, sys
          old = json.loads(subprocess.run(['git', 'show', 'HEAD:data/cvtd.json'], capture_output=True, text=True).stdout)
          new = json.load(open('data/cvtd.json'))
          had = {r['id'] for r in old['routes'] if r.get('stops')}
          lost = [r['short'] or r['long'] for r in new['routes'] if r['id'] in had and not r.get('stops')]
          if lost: print('::error::routes left with no trips:', ', '.join(lost)); sys.exit(1)
          EOF
      # Each tool below that reads from elsewhere runs through tools/upstream.py: its source unreachable, or nothing
      # worth keeping (75), and yesterday's file stands, green; the tool broken, and yesterday's file stands, the
      # night's timetable still goes up, and the run ends red (tools/kept.sh, and the last step).
      - name: Intersections along each route, from the map tiles
        run: python3 tools/crossings.py || sh tools/kept.sh $? data/crossings.json ''
      - name: Places to search for, from OpenStreetMap (once a night, one query)
        run: python3 tools/upstream.py tools/osmplaces.py || sh tools/kept.sh $? data/osm-places.json 'Overpass unreachable; keeping the last places'
      - name: Busy roads and their crossings, for walks, from OpenStreetMap
        run: python3 tools/upstream.py tools/walks.py || sh tools/kept.sh $? data/walks.json 'Overpass unreachable; keeping the last roads'
      - name: The ways a rider walks (footways, paths, steps, sidewalks, streets), from OpenStreetMap
        run: python3 tools/upstream.py tools/walknet.py || sh tools/kept.sh $? data/walknet.json 'Overpass unreachable; keeping the last ways'
      - name: Snapshot the USU shuttle's routes and stops
        run: python3 tools/upstream.py tools/usu.py || sh tools/kept.sh $? data/usu.json 'shuttle feed unreachable; keeping the last snapshot'
      - name: POOL's pickup points, from Connect's published Remix map
        run: python3 tools/upstream.py tools/pool.py || sh tools/kept.sh $? data/pool.json 'Remix unreachable; keeping the last POOL points'
      - name: Stops out of the timetable for a detour, kept as closed stops a while
        run: python3 tools/upstream.py tools/gone.py || sh tools/kept.sh $? data/gone-stops.json 'kept stops not refreshed; keeping the last'
      # The routes kept by hand (tools/prt.json): their operator's timetable and holidays, as typed in? A change is a
      # warning here and a line in the night's commit, never a stop; the file is put right by hand.
      - name: Hand-kept routes' sources unchanged
        run: python3 tools/handcheck.py || echo "BROKE=${BROKE:+$BROKE }tools/handcheck.py" >> "$GITHUB_ENV"
      - name: Commit if changed
        run: |
          # The built date alone is not a change worth a commit.
          changed=$(python3 - <<'EOF'
          import json, subprocess
          new = json.load(open('data/cvtd.json')); new['feed'].pop('built', None)
          try:
              old = json.loads(subprocess.check_output(['git', 'show', 'HEAD:data/cvtd.json'])); old['feed'].pop('built', None)
          except Exception:
              old = None
          shapes = subprocess.call(['git', 'diff', '--quiet', '--', 'data/cvtd-shapes.json', 'data/usu.json', 'data/crossings.json', 'data/pool.json']) != 0
          # The OpenStreetMap files carry the snapshot they were cut from (osm, tools/overpass.py), which moves every
          # night: a change only when something else in them did, and put back as it was when nothing did.
          for f in ('data/osm-places.json', 'data/walks.json', 'data/walknet.json'):
              try:
                  a, b = json.load(open(f)), json.loads(subprocess.check_output(['git', 'show', 'HEAD:' + f]))
                  had = 'osm' in b
                  a.pop('osm', None); b.pop('osm', None)
                  same = had and a == b
              except Exception:
                  same = False
              if same: subprocess.call(['git', 'checkout', '--', f])
              else: shapes = True
          # The stops kept out of the timetable: a change when one comes or goes, not when its dates move on.
          ids = lambda j: sorted(s['id'] for s in (j or {}).get('stops', []))
          try:
              gone = ids(json.load(open('data/gone-stops.json'))) != ids(json.loads(subprocess.check_output(['git', 'show', 'HEAD:data/gone-stops.json'])))
          except Exception:
              gone = True
          print('yes' if new != old or shapes or gone else 'no')
          EOF
          )
          if [ "$changed" != yes ]; then echo 'no change'; if [ -n "$DATA_NOTE" ]; then echo "$DATA_NOTE"; fi; git checkout -- data; exit 0; fi
          git config user.name 'transit data'
          git config user.email 'actions@users.noreply.github.com'
          git add data/cvtd.json data/cvtd-shapes.json data/usu.json data/crossings.json data/osm-places.json data/pool.json data/gone-stops.json data/walks.json data/walknet.json
          if [ -n "$DATA_NOTE" ]; then git commit -m "Transit data: $(date -u +%Y-%m-%d)" -m "$DATA_NOTE"; else git commit -m "Transit data: $(date -u +%Y-%m-%d)"; fi
          # Onto whatever another run (alerts, the timetable, the map) pushed meanwhile, a few tries.
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done; exit 1
      - name: Every tool ran
        if: env.BROKE != ''
        run: |
          echo "::error::a tool broke this run, its last file kept: $BROKE"
          exit 1
