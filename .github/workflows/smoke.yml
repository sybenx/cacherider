name: smoke test

# Every flow in the app in a real browser (tools/smoke), on demand: the same run the nightly jobs make before they
# ship an update, and the pre-push hook before a push.
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Smoke test
        run: cd tools/smoke && npm ci --silent && npx playwright install --with-deps chromium >/dev/null && npx playwright test --reporter=dot
