plugins { id 'com.android.application' }

// The version comes from the release tag (v1.2.3 → 1.2.3 / 10203); a local build gets 0.0.0.
def verName = project.findProperty('versionName') ?: '0.0.0'
def verCode = (project.findProperty('versionCode') ?: '1') as Integer

android {
  namespace 'com.cacherider.android'
  compileSdk 36
  defaultConfig {
    applicationId 'com.cacherider.android'
    minSdk 24
    targetSdk 36
    versionCode verCode
    versionName verName
  }
  signingConfigs {
    release {
      // Filled from the workflow's secrets; a machine without them builds unsigned.
      def ks = System.getenv('ANDROID_KEYSTORE_FILE')
      if (ks) {
        storeFile file(ks)
        storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
        keyAlias System.getenv('ANDROID_KEY_ALIAS')
        keyPassword System.getenv('ANDROID_KEY_PASSWORD')
      }
    }
  }
  buildTypes {
    release {
      minifyEnabled false
      if (System.getenv('ANDROID_KEYSTORE_FILE')) signingConfig signingConfigs.release
    }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
  implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
  // Location delegation: the browser asks this app for the rider's location, with this app's permission (DelegationService).
  implementation 'com.google.androidbrowserhelper:locationdelegation:1.1.2'
}
